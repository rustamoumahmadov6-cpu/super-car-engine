<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Car Engine - Ultimate 3D City & Night Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #050508;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 { margin-bottom: 5px; font-size: 16px; letter-spacing: 2px; color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
        .game-wrapper {
            position: relative;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.3);
            border: 3px solid #00ffcc;
            border-radius: 6px;
            overflow: hidden;
        }
        canvas { display: block; background: #111; }
        .dashboard {
            margin-top: 10px;
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid #333;
            font-size: 13px;
        }
        .dashboard span { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <h1>SUPER CAR ENGINE // 3D CITY & DYNAMIC WORLD v10.0</h1>
    
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="950" height="520"></canvas>
    </div>
    
    <div class="dashboard">
        <div>Суръат: <span id="ui-spd">0</span> км/с</div>
        <div>Гирду атроф: <span id="ui-gear">1</span></div>
        <div>Нитро: <span id="ui-nitro">100%</span></div>
        <div>Вақт: <span id="ui-time">Рӯз ☀️</span></div>
        <div>Холҳо: <span id="ui-score">0</span></div>
        <div>Саломатӣ: <span id="ui-hp">100%</span></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Тафсилоти мошин
        const car = {
            x: canvas.width / 2,
            y: canvas.height - 120,
            width: 44,
            height: 80,
            speed: 0,
            maxSpeed: 20,
            accel: 0.3,
            friction: 0.06,
            angle: 0,
            steer: 0.05,
            gear: 1,
            nitro: 100,
            health: 100
        };

        const keys = { up: false, down: false, left: false, right: false, nitro: false, brake: false };

        window.addEventListener('keydown', e => handleKey(e, true));
        window.addEventListener('keyup', e => handleKey(e, false));

        function handleKey(e, isDown) {
            switch(e.code) {
                case 'ArrowUp': case 'KeyW': keys.up = isDown; break;
                case 'ArrowDown': case 'KeyS': keys.down = isDown; break;
                case 'ArrowLeft': case 'KeyA': keys.left = isDown; break;
                case 'ArrowRight': case 'KeyD': keys.right = isDown; break;
                case 'Space': keys.nitro = isDown; break;
                case 'KeyB': keys.brake = isDown; break;
            }
        }

        // Системаи шаб ва рӯз (Dynamic Day/Night Cycle)
        let worldTime = 0; // 0 то 1000
        let isNight = false;

        // Биноҳои шаҳр ва монеаҳо (City Buildings & Traffic)
        let cityObjects = [];
        let score = 0;
        let roadOffset = 0;

        function updateWorldEnvironment() {
            worldTime += 0.2;
            if (worldTime > 1000) worldTime = 0;
            isNight = (worldTime > 500); // Нисфи дуюми вақт шаб мешавад

            // Илова кардани биноҳои шаҳр ва мошинҳои рақиб
            if (Math.random() < 0.03 && cityObjects.length < 8) {
                let isBuilding = Math.random() > 0.4;
                cityObjects.push({
                    type: isBuilding ? 'building' : 'car',
                    x: isBuilding ? (Math.random() > 0.5 ? 30 : canvas.width - 130) : Math.random() * (canvas.width - 200) + 100,
                    y: -100,
                    width: isBuilding ? 100 : 44,
                    height: isBuilding ? 150 : 80,
                    speed: isBuilding ? 0 : Math.random() * 2 + 1,
                    color: `hsl(${Math.random() * 360}, 70%, 50%)`
                });
            }

            for (let i = cityObjects.length - 1; i >= 0; i--) {
                let obj = cityObjects[i];
                obj.y += (obj.type === 'building' ? car.speed : obj.speed + car.speed * 0.5);

                // Санҷиши бархӯрд (Collision Detection / Садама)
                if (
                    car.x - car.width/2 < obj.x + obj.width &&
                    car.x + car.width/2 > obj.x &&
                    car.y - car.height/2 < obj.y + obj.height &&
                    car.y + car.height/2 > obj.y
                ) {
                    car.speed *= -0.3; // Зарба / Садама
                    car.health -= 5;
                    cityObjects.splice(i, 1);
                    continue;
                }

                if (obj.y > canvas.height + 150) {
                    cityObjects.splice(i, 1);
                    score += 50;
                }
            }
        }

        function updatePhysics() {
            let maxSpd = keys.nitro && car.nitro > 0 ? car.maxSpeed * 1.6 : car.maxSpeed;
            let currentAccel = keys.nitro && car.nitro > 0 ? car.accel * 2 : car.accel;

            if (keys.nitro && car.nitro > 0) car.nitro -= 0.5;
            else if (car.nitro < 100) car.nitro += 0.1;

            if (keys.up) {
                car.speed += currentAccel;
                if (car.speed > maxSpd) car.speed = maxSpd;
            } else if (keys.down || keys.brake) {
                car.speed -= currentAccel * 1.5;
                if (car.speed < -maxSpd / 3) car.speed = -maxSpd / 3;
            } else {
                if (car.speed > 0) car.speed -= car.friction;
                if (car.speed < 0) car.speed += car.friction;
                if (Math.abs(car.speed) < car.friction) car.speed = 0;
            }

            if (keys.left && car.speed !== 0) car.angle -= car.steer * (car.speed / car.maxSpeed);
            if (keys.right && car.speed !== 0) car.angle += car.steer * (car.speed / car.maxSpeed);

            car.x += Math.sin(car.angle) * car.speed;
            car.y -= Math.cos(car.angle) * car.speed;

            // Сарҳадди роҳ
            if (car.x < 100) car.x = 100;
            if (car.x > canvas.width - 100) car.x = canvas.width - 100;
            if (car.y < 60) car.y = 60;
            if (car.y > canvas.height - 60) car.y = canvas.height - 60;

            car.gear = Math.abs(car.speed) > 12 ? 4 : (Math.abs(car.speed) > 8 ? 3 : (Math.abs(car.speed) > 4 ? 2 : 1));
            score += Math.abs(car.speed) * 0.05;
        }

        // РАЙКАВИИ ГРАФИКАИ 3D ВА ШАҲР
        function renderScene() {
            // Ранги замина вобаста ба шаб ё рӯз
            ctx.fillStyle = isNight ? "#020208" : "#1a2a3a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Роҳи асфалтии шаҳр
            ctx.fillStyle = isNight ? "#111115" : "#222222";
            ctx.fillRect(100, 0, canvas.width - 200, canvas.height);

            // Тротуари канори роҳ
            ctx.fillStyle = isNight ? "#1c1c24" : "#444";
            ctx.fillRect(80, 0, 20, canvas.height);
            ctx.fillRect(canvas.width - 100, 0, 20, canvas.height);

            // Хатҳои миёнаи роҳ (3D Pseudo Effect)
            ctx.strokeStyle = isNight ? "#00ffcc" : "#ffffff";
            ctx.lineWidth = 5;
            ctx.setLineDash([30, 30]);
            ctx.lineDashOffset = -roadOffset;

            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            roadOffset += car.speed * 2.5;

            // Намоиши биноҳо ва мошинҳои шаҳр
            cityObjects.forEach(obj => {
                if (obj.type === 'building') {
                    ctx.fillStyle = isNight ? "#0f0f1a" : "#333344";
                    ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
                    // Равзанаҳои биноҳо дар шаб медурахшанд
                    if (isNight) {
                        ctx.fillStyle = "#ffcc00";
                        for(let bx = obj.x + 10; bx < obj.x + obj.width - 10; bx += 20) {
                            for(let by = obj.y + 15; by < obj.y + obj.height - 15; by += 25) {
                                ctx.fillRect(bx, by, 10, 15);
                            }
                        }
                    }
                } else {
                    drawCar(obj.x, obj.y, 0, obj.color, false);
                }
            });

            // Намоиши мошини асосӣ
            drawCar(car.x, car.y, car.angle, keys.nitro ? "#ff9900" : "#00ffcc", true);
        }

        function drawCar(x, y, angle, color, isPlayer) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // Соя
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(-car.width/2 + 6, -car.height/2 + 6, car.width, car.height);

            // Бадан
            ctx.fillStyle = color;
            ctx.fillRect(-car.width/2, -car.height/2, car.width, car.height);

            // Шшаҳо
            ctx.fillStyle = "#050505";
            ctx.fillRect(-car.width/2 + 6, -car.height/2 + 14, car.width - 12, 18);
            ctx.fillRect(-car.width/2 + 6, car.height/2 - 20, car.width - 12, 10);

            // Чароғҳо (дар шаб равшантар мешаванд)
            ctx.fillStyle = (isNight || (isPlayer && keys.nitro)) ? "#ffff66" : "#ffff00";
            ctx.fillRect(-car.width/2 + 3, -car.height/2, 8, 5);
            ctx.fillRect(car.width/2 - 11, -car.height/2, 8, 5);

            ctx.fillStyle = "#ff0000";
            ctx.fillRect(-car.width/2 + 3, car.height/2 - 5, 8, 4);
            ctx.fillRect(car.width/2 - 11, car.height/2 - 5, 8, 4);

            ctx.restore();
        }

        function updateUI() {
            document.getElementById('ui-spd').innerText = Math.round(Math.abs(car.speed) * 10);
            document.getElementById('ui-gear').innerText = car.gear;
            document.getElementById('ui-nitro').innerText = Math.round(car.nitro) + '%';
            document.getElementById('ui-time').innerText = isNight ? "Шаб 🌙" : "Рӯз ☀️";
            document.getElementById('ui-score').innerText = Math.round(score);
            document.getElementById('ui-hp').innerText = Math.max(0, car.health) + '%';
        }

        function gameLoop() {
            if (car.health > 0) {
                updatePhysics();
                updateWorldEnvironment();
            }
            renderScene();
            updateUI();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
